[package]
name = "apex-timer"
description = "Tray helper that holds the system timer resolution for Apex Tune"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "apex_timer"
path = "src/lib.rs"

[[bin]]
name = "apex-timer"
path = "src/main.rs"
required-features = ["tray"]

[features]
default = ["tray"]
# The tray UI; Apex Tune itself only uses the library.
tray = ["dep:tray-icon"]

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", optional = true }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
